name: Release @funnelish/smooth-dnd

# Publishes only from PROD. `master` is the integration branch and never
# reaches the registry. A release is a PR from master -> PROD.
on:
  push:
    branches:
      - PROD
  workflow_dispatch:

# Least privilege by default; each job opts into exactly what it needs.
permissions:
  contents: read

# Two releases must never race the registry.
concurrency:
  group: release-smooth-dnd
  cancel-in-progress: false

jobs:
  verify:
    name: Build & pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.pkg.outputs.version }}
      already-published: ${{ steps.check.outputs.exists }}
    steps:
      # Actions are pinned to commit SHAs: a mutable tag like @v7 can be
      # repointed at malicious code by a compromised action repo.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com/
          scope: '@funnelish'

      # --ignore-scripts blocks arbitrary install-time code from the
      # dependency tree. This package needs no native build steps.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Read package version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already published
        id: check
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if npm view "@funnelish/smooth-dnd@${{ steps.pkg.outputs.version }}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::@funnelish/smooth-dnd@${{ steps.pkg.outputs.version }} already exists — publish will be skipped."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: pnpm run build

      - name: Verify build output
        run: |
          test -s dist/index.js
          test -s dist/index.esm.js
          test -s dist/index.d.ts

      # Pack here so the bytes that get published are exactly the bytes
      # that were built and checked. The publish job never rebuilds.
      - name: Pack tarball
        run: pnpm pack --pack-destination ./artifact

      - name: Upload tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-tarball
          path: artifact/*.tgz
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish to GitHub Packages
    needs: verify
    if: needs.verify.outputs.already-published == 'false'
    runs-on: ubuntu-latest
    # Protected environment: required reviewers, restricted to the PROD branch.
    environment:
      name: production
      url: https://github.com/Funnelish/smooth-dnd/pkgs/npm/smooth-dnd
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      # Deliberately no checkout and no install: nothing from the repo or
      # its dependency tree executes in the job holding packages:write.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com/
          scope: '@funnelish'

      - name: Download tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-tarball
          path: artifact

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'artifact/*.tgz'

      # `npm publish <tarball>` deliberately, not pnpm: this job installs
      # nothing, so it needs no package manager beyond the one bundled with
      # Node. pnpm publish expects a project directory, not a tarball.
      #
      # The path MUST stay './'-prefixed. npm parses a bare `dir/file.tgz` as
      # the `owner/repo` GitHub shorthand and tries to git-clone it, which
      # fails with a misleading "Permission denied (publickey)".
      - name: Publish
        run: |
          shopt -s nullglob
          tarballs=(./artifact/*.tgz)
          if [ ${#tarballs[@]} -ne 1 ]; then
            echo "::error::expected exactly one tarball in ./artifact, found ${#tarballs[@]}"
            exit 1
          fi
          echo "Publishing ${tarballs[0]}"
          npm publish "${tarballs[0]}" --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tag:
    name: Tag release
    needs: [verify, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --target "${GITHUB_SHA}" \
            --generate-notes
