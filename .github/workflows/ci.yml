name: CI

# Runs on the integration branch and on every release PR into PROD,
# so a release is verified before the merge that publishes it.
on:
  push:
    branches: [master, PROD]
  pull_request:
    branches: [master, PROD]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          test -s dist/index.js
          test -s dist/index.esm.js
          test -s dist/index.d.ts

      # Surfaces exactly which files would ship, so an accidental change to
      # `files` is visible in the PR rather than after publishing.
      - name: Report packed contents
        run: npm pack --dry-run
